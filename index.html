<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f4ef" />
    <meta
      name="description"
      content="FOCUS FLOW — спокойное пространство для задач, концентрации и осмысленного дня. Бесплатный персональный планировщик без регистрации."
    />
    <title>FOCUS FLOW — пространство для главного</title>
    <link
      rel="preload"
      href="./fonts/manrope-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/styles.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>
    <aside class="sidebar" aria-label="Главная навигация">
      <a class="brand" href="#dashboard" aria-label="FOCUS FLOW — мой день"
        ><span class="brand-mark" aria-hidden="true">✳</span
        ><span
          >focus<span class="brand-flow">flow</span
          ><small>MAKE ROOM FOR WHAT MATTERS</small></span
        ></a
      >
      <div class="nav-caption">ВАШЕ ПРОСТРАНСТВО</div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note">
          <span class="tiny-spark">✳</span>
          <p>Не больше дел.<br />Больше смысла.</p>
          <span>Один шаг за раз.</span>
        </div>
        <button class="profile" data-action="navigate" data-view="settings">
          <span class="avatar">Я</span
          ><span
            ><b id="profile-name">Моё пространство</b
            ><small>Только ваш ритм</small></span
          ><span aria-hidden="true">↗</span>
        </button>
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <span class="mobile-brand">✳</span><span>Моё пространство</span
          ><span class="crumb-slash">/</span
          ><strong id="page-label">Мой день</strong>
        </div>
        <div class="top-actions">
          <span class="local-status"><i></i> Всё на вашем устройстве</span
          ><button
            id="theme-toggle"
            class="icon-button"
            data-action="theme"
            aria-label="Включить тёмную тему"
          ></button
          ><button
            class="icon-button mobile-settings"
            data-action="navigate"
            data-view="settings"
            aria-label="Настройки"
            id="mobile-settings"
          ></button
          ><button
            class="button primary top-add"
            data-action="add"
            aria-label="Новая задача"
          >
            <span aria-hidden="true">＋</span><span>Новая задача</span>
          </button>
        </div>
      </header>
      <div
        id="storage-warning"
        class="storage-warning"
        role="alert"
        hidden
      ></div>
      <main id="main" tabindex="-1"></main>
      <footer class="app-footer">
        <span>Меньше шума. Больше фокуса.</span
        ><span>FOCUS FLOW <span class="footer-dot">✳</span></span>
      </footer>
    </div>
    <nav
      class="mobile-nav"
      id="mobile-nav"
      aria-label="Мобильная навигация"
    ></nav>
    <div id="mini-timer" class="mini-timer" hidden></div>
    <div
      id="toasts"
      class="toasts"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <dialog id="task-dialog" class="modal">
      <form id="task-form">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">МЕСТО ДЛЯ НОВОЙ ИДЕИ</span>
            <h2 id="task-dialog-title">Новая задача</h2>
          </div>
          <button
            type="button"
            class="icon-button"
            data-action="close-task"
            aria-label="Закрыть"
          >
            ×
          </button>
        </div>
        <input type="hidden" name="id" /><label
          >Название задачи<input
            name="title"
            required
            maxlength="160"
            placeholder="Что хочется сделать?"
            autocomplete="off" /></label
        ><label
          >Описание <span class="optional">необязательно</span
          ><textarea
            name="description"
            maxlength="4000"
            rows="3"
            placeholder="Детали, идеи, первый шаг…"
          ></textarea>
        </label>
        <div class="form-grid">
          <label
            >Категория<select name="category">
              <option value="work">Работа</option>
              <option value="personal">Личное</option>
              <option value="learn">Учёба</option>
              <option value="health">Здоровье</option>
            </select></label
          ><label
            >Приоритет<select name="priority">
              <option value="high">Высокий</option>
              <option value="medium" selected>Средний</option>
              <option value="low">Низкий</option>
            </select></label
          ><label
            >Дата<input
              name="date"
              type="date"
              min="1900-01-01"
              max="2200-12-31" /></label
          ><label>Время<input name="time" type="time" /></label>
        </div>
        <label
          >Примерная длительность, мин<input
            name="duration"
            type="number"
            min="1"
            max="480"
            value="25"
            required
        /></label>
        <p id="task-error" class="form-error" role="alert"></p>
        <div class="dialog-footer">
          <button type="button" class="button subtle" data-action="close-task">
            Отмена</button
          ><button class="button primary" type="submit">
            Сохранить задачу <span aria-hidden="true">↗</span>
          </button>
        </div>
      </form>
    </dialog>
    <dialog
      id="confirm-dialog"
      class="modal confirm-modal"
      aria-labelledby="confirm-title"
    >
      <div class="confirm-symbol">!</div>
      <h2 id="confirm-title"></h2>
      <p id="confirm-description"></p>
      <div class="dialog-footer">
        <button class="button subtle" data-action="cancel-confirm">
          Отмена</button
        ><button class="button danger" id="confirm-ok">Подтвердить</button>
      </div>
    </dialog>
    <input
      id="import-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <noscript
      >Для работы FOCUS FLOW включите JavaScript. Все данные хранятся только в
      вашем браузере.</noscript
    >
  </body>
</html>
